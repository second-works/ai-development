name: Template CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verification:
    # Runs on the owner's Mac (#191). Fork pull requests go to a hosted runner
    # instead of being skipped, because a skipped job reports success.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "macOS", "ai-development"]') }}
    timeout-minutes: 10

    steps:
      - name: Require Bash 5
        run: bash -c '((BASH_VERSINFO[0] >= 5))' || { echo "Bash 5 is required on the runner PATH"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Shell syntax
        run: bash -n scripts/verify.sh tests/lightweight-template/run-samples.sh templates/lightweight/place.sh templates/lightweight/.claude/hooks/guard-git-push.sh templates/lightweight/.claude/skills/steward/scripts/check-pr-head.sh tests/cloud-agent-environment/run-samples.sh templates/verification/verify.sh templates/security/security-preflight.sh templates/app/bin/setup templates/app/bin/doctor tests/verification/run-samples.sh tests/app-template/run-samples.sh tests/acceptance-verification/run-samples.sh tests/verification-evidence/run-samples.sh tests/security-preflight/run-samples.sh tests/review-evidence/run-samples.sh tests/agent-security-boundary/run-samples.sh tests/product-ui-standard/run-samples.sh tests/instruction-architecture/run-samples.sh tests/plan-to-issues/run-samples.sh

      - name: Verification samples
        run: tests/verification/run-samples.sh

      - name: Application setup and doctor template contract
        run: bash tests/app-template/run-samples.sh

      - name: Instruction architecture and read-only smoke test contract
        run: bash tests/instruction-architecture/run-samples.sh

      - name: Plan to Issues Skill contract
        run: bash tests/plan-to-issues/run-samples.sh

      - name: PRODUCT UI standard documentation contract
        run: bash tests/product-ui-standard/run-samples.sh

      - name: Review Evidence documentation contract
        run: bash tests/review-evidence/run-samples.sh

      - name: FOLLOW-UP documentation contract
        run: bash tests/pr-review-followups/run-samples.sh

      - name: Deployment design documentation contract
        run: bash tests/deployment-design/run-samples.sh

      - name: Acceptance verification documentation contract
        run: bash tests/acceptance-verification/run-samples.sh

      - name: Verification Evidence documentation contract
        run: bash tests/verification-evidence/run-samples.sh

      - name: Safe Auto-Fix and Auto-Merge documentation contract
        run: bash tests/safe-auto-fix/run-samples.sh

      - name: Security Preflight documentation contract
        run: bash tests/security-preflight/run-samples.sh

      - name: Agent Security Boundary documentation contract
        run: bash tests/agent-security-boundary/run-samples.sh

      - name: Cloud Agent environment execution regression
        run: bash tests/cloud-agent-environment/run-samples.sh

      - name: GitHub state collection regression
        run: bash tests/github-state/run-samples.sh

      - name: HTML status report regression
        run: bash tests/html-status-report/run-samples.sh

      - name: Lightweight template
        run: bash tests/lightweight-template/run-samples.sh

      - name: Repository placement matches the lightweight template
        run: bash templates/lightweight/place.sh --check .
