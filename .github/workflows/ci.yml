name: Template CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        run: bash -n templates/verification/verify.sh tests/verification/run-samples.sh

      - name: Verification samples
        run: tests/verification/run-samples.sh
