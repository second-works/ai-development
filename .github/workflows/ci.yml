name: Template CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        run: bash -n templates/verification/verify.sh templates/security/security-preflight.sh templates/app/bin/setup templates/app/bin/doctor tests/verification/run-samples.sh tests/app-template/run-samples.sh tests/acceptance-verification/run-samples.sh tests/security-preflight/run-samples.sh tests/review-evidence/run-samples.sh tests/agent-security-boundary/run-samples.sh tests/harness-minimalism/run-samples.sh tests/product-ui-standard/run-samples.sh tests/issue-template-ui/run-samples.sh

      - name: Verification samples
        run: tests/verification/run-samples.sh

      - name: Application setup and doctor template contract
        run: bash tests/app-template/run-samples.sh

      - name: Issue template UI Level documentation contract
        run: bash tests/issue-template-ui/run-samples.sh

      - name: Plan Review Gate documentation contract
        run: bash tests/plan-review-gate/run-samples.sh

      - name: PRODUCT UI standard documentation contract
        run: bash tests/product-ui-standard/run-samples.sh

      - name: Review Evidence documentation contract
        run: bash tests/review-evidence/run-samples.sh

      - name: FOLLOW-UP documentation contract
        run: bash tests/pr-review-followups/run-samples.sh

      - name: Deployment design documentation contract
        run: bash tests/deployment-design/run-samples.sh

      - name: Acceptance verification documentation contract
        run: bash tests/acceptance-verification/run-samples.sh

      - name: Safe Auto-Fix and Auto-Merge documentation contract
        run: bash tests/safe-auto-fix/run-samples.sh

      - name: Security Preflight documentation contract
        run: bash tests/security-preflight/run-samples.sh

      - name: Agent Security Boundary documentation contract
        run: bash tests/agent-security-boundary/run-samples.sh

      - name: Harness Minimalism documentation contract
        run: bash tests/harness-minimalism/run-samples.sh
