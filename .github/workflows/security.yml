name: Security

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  security-preflight:
    name: Security Preflight
    # Runs on the owner's Mac (#191). Fork pull requests go to a hosted runner
    # instead of being skipped, because a skipped job reports success.
    runs-on: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "macOS", "ai-development"]') }}
    timeout-minutes: 10

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run Security Preflight
        run: bash templates/security/security-preflight.sh .
