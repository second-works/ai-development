name: Security

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  security-preflight:
    name: Security Preflight
    # Runs on the owner's Mac (#191). Fork pull requests are not run there.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ai-development]
    timeout-minutes: 10

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run Security Preflight
        run: bash templates/security/security-preflight.sh .
