name: Local Judge Synthetic Smoke Test

on:
  workflow_dispatch:

# The smoke test does not read GitHub data or call the GitHub API.
permissions: {}

concurrency:
  group: local-judge-shadow
  cancel-in-progress: false

jobs:
  validate-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Reject dispatches outside the default branch
        env:
          WORKFLOW_REF_TYPE: ${{ github.ref_type }}
          WORKFLOW_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF_TYPE" != "branch" || "$WORKFLOW_REF" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Manual dispatch must use the default branch."
            exit 1
          fi

  synthetic-smoke:
    needs: validate-ref
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: local-judge-shadow
    steps:
      - name: Send one fixed synthetic request
        env:
          WORKFLOW_REF_TYPE: ${{ github.ref_type }}
          WORKFLOW_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LOCAL_JUDGE_URL: ${{ vars.LOCAL_JUDGE_URL }}
          LOCAL_JUDGE_HOST: ${{ vars.LOCAL_JUDGE_HOST }}
          LOCAL_JUDGE_TOKEN: ${{ secrets.LOCAL_JUDGE_TOKEN }}
          LOCAL_JUDGE_ACCESS_CLIENT_ID: ${{ secrets.LOCAL_JUDGE_ACCESS_CLIENT_ID }}
          LOCAL_JUDGE_ACCESS_CLIENT_SECRET: ${{ secrets.LOCAL_JUDGE_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          import os
          import re
          import socket
          import ssl
          import time
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlsplit
          from urllib.request import (HTTPRedirectHandler, HTTPSHandler, ProxyHandler,
                                      Request, build_opener)

          def fail(reason):
              print(f"LOCAL_JUDGE_SMOKE_STATUS=FAILED ({reason})")
              raise SystemExit(1)

          if (os.environ.get("WORKFLOW_REF_TYPE") != "branch"
                  or os.environ.get("WORKFLOW_REF") != os.environ.get("DEFAULT_BRANCH")):
              fail("manual dispatch must use the default branch")

          required = (
              "LOCAL_JUDGE_URL", "LOCAL_JUDGE_HOST", "LOCAL_JUDGE_TOKEN",
              "LOCAL_JUDGE_ACCESS_CLIENT_ID", "LOCAL_JUDGE_ACCESS_CLIENT_SECRET",
          )
          if any(not os.environ.get(name) for name in required):
              fail("required Environment value is missing")

          host = os.environ["LOCAL_JUDGE_HOST"]
          try:
              endpoint = urlsplit(os.environ["LOCAL_JUDGE_URL"])
              endpoint_port = endpoint.port
          except ValueError:
              fail("endpoint is malformed")
          if (not re.fullmatch(r"[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?", host)
                  or "." not in host or re.fullmatch(r"[0-9.]+", host)
                  or endpoint.scheme != "https" or endpoint.hostname != host
                  or endpoint.netloc != host or endpoint_port is not None
                  or endpoint.path != "/triage" or endpoint.query or endpoint.fragment
                  or endpoint.username or endpoint.password):
              fail("endpoint must be exactly https://LOCAL_JUDGE_HOST/triage")

          for name in ("LOCAL_JUDGE_TOKEN", "LOCAL_JUDGE_ACCESS_CLIENT_ID",
                       "LOCAL_JUDGE_ACCESS_CLIENT_SECRET"):
              credential = os.environ[name]
              if not re.fullmatch(r"[!-~]{1,512}", credential):
                  fail("authentication value contains invalid header characters")
          if not re.fullmatch(r"[!-~]{32,256}", os.environ["LOCAL_JUDGE_TOKEN"]):
              fail("LOCAL_JUDGE_TOKEN has an invalid format")

          # Fixed synthetic fixture only. No PR, issue, comment, or diff is read.
          synthetic = {
              "comment_id": "15300001",
              "body": "Synthetic connectivity check. This is not a real review.",
              "diff_hunk": "@@ synthetic test diff @@",
          }
          payload = json.dumps(synthetic, separators=(",", ":")).encode("utf-8")
          request = Request(
              os.environ["LOCAL_JUDGE_URL"], data=payload, method="POST",
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + os.environ["LOCAL_JUDGE_TOKEN"],
                  "CF-Access-Client-Id": os.environ["LOCAL_JUDGE_ACCESS_CLIENT_ID"],
                  "CF-Access-Client-Secret": os.environ["LOCAL_JUDGE_ACCESS_CLIENT_SECRET"],
              },
          )

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *_args, **_kwargs):
                  return None

          # Ignore runner proxy settings and reject redirects so credentials can
          # only reach the exact, TLS-verified /triage host configured above.
          opener = build_opener(ProxyHandler({}), NoRedirect(),
                                HTTPSHandler(context=ssl.create_default_context()))
          started = time.monotonic()
          try:
              with opener.open(request, timeout=30) as response:
                  if response.status != 200:
                      fail(f"unexpected HTTP status {response.status}")
                  chunks = []
                  size = 0
                  while not response.isclosed():
                      remaining = 30 - (time.monotonic() - started)
                      if remaining <= 0:
                          fail("request timed out")
                      response.fp.raw._sock.settimeout(remaining)
                      chunk = response.read1(min(4096, 32769 - size))
                      if time.monotonic() - started >= 30:
                          fail("request timed out")
                      if not chunk:
                          if response.length not in (None, 0):
                              fail("response was incomplete")
                          break
                      chunks.append(chunk)
                      size += len(chunk)
                      if size > 32768:
                          fail("response exceeded 32 KiB")
                  raw = b"".join(chunks)
          except (TimeoutError, socket.timeout):
              fail("request timed out")
          except HTTPError as error:
              # Never print the body or request headers; Access errors can contain
              # proxy details and must not expose any credentials.
              fail(f"HTTP {error.code}")
          except (URLError, OSError):
              fail("connection failed")
          except (ValueError, UnicodeError):
              fail("response was malformed")
          except Exception:
              fail("connection failed")

          if len(raw) > 32768:
              fail("response exceeded 32 KiB")

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate JSON key")
                  result[key] = value
              return result

          def reject_constant(_value):
              raise ValueError("non-finite JSON number")

          fields = ("needs_action", "category", "priority", "auto_fixable", "high_risk")
          options = {
              "needs_action": {"A": True, "B": False},
              "category": dict(zip("ABCDEF", ("security", "bug", "test", "style", "docs", "other"))),
              "priority": dict(zip("ABCD", ("p0", "p1", "p2", "p3"))),
              "auto_fixable": {"A": True, "B": False},
              "high_risk": {"A": True, "B": False},
          }
          expected_result_keys = {
              "comment_id", "model", "mode", "authoritative", "decision", "probabilities",
              "latency_ms", "field_latency_ms", "cache_prompt", "cache_tokens", "probability_kind",
          }
          try:
              document = json.loads(raw, object_pairs_hook=unique_object, parse_constant=reject_constant)
              if not isinstance(document, dict) or set(document) != {"result"}:
                  fail("response schema is invalid")
              result = document["result"]
              if not isinstance(result, dict) or set(result) != expected_result_keys:
                  fail("response schema is invalid")
              decision = result["decision"]
              latency = result["latency_ms"]
              probabilities = result["probabilities"]
              field_latency = result["field_latency_ms"]
              cache_tokens = result["cache_tokens"]
          except (ValueError, KeyError, TypeError):
              fail("response schema is invalid")

          if (result.get("comment_id") != synthetic["comment_id"]
                  or result.get("model") != "gemma-4-e4b"
                  or result.get("mode") != "shadow"
                  or result.get("authoritative") is not False
                  or result.get("probability_kind") != "constrained_distribution"
                  or type(result.get("cache_prompt")) is not bool
                  or not isinstance(decision, dict) or set(decision) != set(fields)
                  or not isinstance(probabilities, dict) or set(probabilities) != set(fields)
                  or not isinstance(field_latency, dict) or set(field_latency) != set(fields)
                  or not isinstance(cache_tokens, dict) or set(cache_tokens) != set(fields)):
              fail("response did not match the shadow contract")

          for field in fields:
              if not any(type(decision[field]) is type(value) and decision[field] == value
                         for value in options[field].values()):
                  fail("response decision is invalid")
              values = probabilities[field]
              if not isinstance(values, dict) or set(values) != set(options[field]):
                  fail("response probabilities are invalid")
              if any(type(value) not in (int, float) or not 0 <= value <= 1
                     or not math.isfinite(value) for value in values.values()):
                  fail("response probabilities are invalid")
              if not math.isclose(sum(values.values()), 1, abs_tol=0.001):
                  fail("response probabilities are invalid")
              selected = options[field][max(values, key=values.get)]
              if type(decision[field]) is not type(selected) or decision[field] != selected:
                  fail("response decision does not match probabilities")
              duration = field_latency[field]
              if (type(duration) not in (int, float) or not 0 <= duration <= 60000
                      or not math.isfinite(duration)):
                  fail("response field latency is invalid")
              cached = cache_tokens[field]
              if (cached is not None and (type(cached) is not int or not 0 <= cached <= 32768)):
                  fail("response cache tokens are invalid")

          if (type(result.get("latency_ms")) not in (int, float)
                  or not 0 <= latency <= 60000 or not math.isfinite(latency)):
              fail("response did not match the shadow contract")

          print("LOCAL_JUDGE_SMOKE_STATUS=PASSED")
          print("LOCAL_JUDGE_SMOKE_MODEL=gemma-4-e4b")
          print("LOCAL_JUDGE_SMOKE_MODE=shadow")
          print("LOCAL_JUDGE_SMOKE_AUTHORITATIVE=false")
          print(f"LOCAL_JUDGE_SMOKE_LATENCY_MS={latency:.3f}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("Synthetic Local Judge request passed through Cloudflare Access.\n")
              summary.write("No GitHub review content was fetched or sent.\n")
              summary.write(f"- Model: `gemma-4-e4b`\n- Mode: `shadow`\n- Authoritative: `false`\n- Latency: `{latency:.3f} ms`\n")
          PY
